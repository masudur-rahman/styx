name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Matches GO_VERSION in the Makefile.
  GO_VERSION: '1.23'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # sql/postgres talks to a real database rather than a mock, so CI has to
    # provide one. The credentials match those hard-coded in postgres_test.go.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The postgres tests skip themselves when no database answers. This job
        # provides one, so tell them a skip here is a failure.
        env:
          STYX_POSTGRES_REQUIRED: '1'
        run: go test -race ./...

  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install formatters
        # Pinned rather than @latest, so a new release of either tool cannot
        # fail an unrelated pull request.
        run: |
          go install github.com/incu6us/goimports-reviser/v3@v3.6.5
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0

      - name: Check formatting
        run: |
          ./hack/fmt.sh vendor
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "::error::formatting is out of date, run 'make fmt'"
            exit 1
          fi

  modules:
    name: Module tidiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check go.mod and go.sum are tidy
        # vendor/ is gitignored, so there is nothing to diff it against; only
        # the module files are checked here.
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "::error::go.mod or go.sum is out of date, run 'go mod tidy'"
            exit 1
          fi
